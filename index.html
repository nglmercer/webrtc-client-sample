<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby de Chat</title>
    <!-- Asegúrate de que este CSS tiene los estilos para el nuevo botón -->
    <link rel="stylesheet" href="./style.css"> 
</head>
<body>
    <div id="app">
        <div class="header"><h1>Bienvenido al Lobby</h1></div>
        <div class="content">
            <div class="form-group">
                <label for="userId">Tu Nombre de Usuario</label>
                <input type="text" id="userId" placeholder="Ej: ana" value="user">
            </div>
            <div class="form-group">
                <label for="roomId">Nombre de la Sala</label>
                <input type="text" id="roomId" placeholder="Ej: sala-secreta-123" value="sala">
            </div>
            <div class="button-group">
                <p style="text-align: center; color: #aaa;">Elige el tipo de chat para crear o unirte:</p>
                <a href="#" class="button button-primary" data-type="text">Chat de Texto</a>
                <a href="#" class="button button-success" data-type="voice">Chat de Voz</a>
                <!-- <<< LÍNEA AÑADIDA >>> -->
                <a href="#" class="button button-danger" data-type="video">Chat de Video</a>
            </div>
        </div>
    </div>
    <script>
        // --- ESTE SCRIPT NO NECESITA NINGÚN CAMBIO ---
        // Funciona perfectamente con el nuevo botón gracias a `e.target.dataset.type`
        document.querySelector('.button-group').addEventListener('click', (e) => {
            if (e.target.tagName === 'A') {
                e.preventDefault();
                
                const userId = document.getElementById('userId').value.trim();
                const roomId = document.getElementById('roomId').value.trim();
                const chatType = e.target.dataset.type; // <-- Esto leerá "video" del nuevo botón

                if (!userId || !roomId) {
                    alert('Por favor, introduce tu nombre y el de la sala.');
                    return;
                }
                
                // Construye los query params
                const params = new URLSearchParams({
                    userId: userId,
                    roomId: roomId
                });

                // Redirige a la página correspondiente (chat-video.html)
                window.location.href = `chat-${chatType}.html?${params.toString()}`;
            }
        });
    </script>
</body>
</html>
